name = "eavesly"
main = "src/index.ts"
compatibility_date = "2024-12-01"
account_id = "3e7f907a9c19e51417873e2cce4fbc5c"

[vars]
ENVIRONMENT = "development"
OPENROUTER_MODEL = "openai/gpt-4.1"
# Advisory disposition-review runs on a cheaper model; omit to fall back to OPENROUTER_MODEL.
DISPOSITION_REVIEW_MODEL = "deepseek/deepseek-chat"
DEEPGRAM_MODEL = "nova-3"

# Secrets (set via `wrangler secret put`):
# INTERNAL_API_KEY
# ACHIEVE_QA_RECOVERY_APPROVED_DIGEST (set only after private review of the exact 17-ID dry run)
# SKYFALL_PROFILE_RECAP_AUTH_KEY (32+ characters; set separately for staging and production)
# SUPABASE_URL
# SUPABASE_SERVICE_ROLE_KEY
# CF_ACCOUNT_ID
# CF_GATEWAY_ID
# CF_AIG_TOKEN
# SLACK_WEBHOOK_URL
# SLACK_WEBHOOK_URL_FULL_QA
# SLACK_WEBHOOK_URL_JOEL_NELSON         (mirror of SLACK_WEBHOOK_URL for jnelson@trypennie.com)
# SLACK_WEBHOOK_URL_FULL_QA_JOEL_NELSON (mirror of SLACK_WEBHOOK_URL_FULL_QA for jnelson@trypennie.com)
# DASHBOARD_BASE_URL  (e.g. https://eavesly.com — used to build review_url in Slack alerts)
# DEEPGRAM_API_KEY
# TWILIO_ACCOUNT_SID
# TWILIO_AUTH_TOKEN

[[rules]]
type = "Text"
globs = ["prompts/**/*.txt"]
fallthrough = true

[[workflows]]
name = "eavesly-evaluation"
binding = "EVALUATION_WORKFLOW"
class_name = "EvaluationWorkflow"

[[workflows]]
name = "eavesly-achieve-backfill-canary"
binding = "ACHIEVE_BACKFILL_CANARY_WORKFLOW"
class_name = "AchieveBackfillCanaryWorkflow"

[[workflows]]
name = "eavesly-achieve-backfill-remaining56"
binding = "ACHIEVE_BACKFILL_REMAINING56_WORKFLOW"
class_name = "AchieveBackfillRemaining56Workflow"

[[workflows]]
name = "eavesly-achieve-backfill-resume27"
binding = "ACHIEVE_BACKFILL_RESUME27_WORKFLOW"
class_name = "AchieveBackfillResume27Workflow"

[[workflows]]
name = "eavesly-achieve-qa-recovery"
binding = "ACHIEVE_QA_RECOVERY_WORKFLOW"
class_name = "AchieveQaRecoveryWorkflow"

[observability]
[observability.logs]
enabled = false
invocation_logs = true

[env.staging]
name = "eavesly-staging"
vars = { ENVIRONMENT = "staging", OPENROUTER_MODEL = "openai/gpt-4.1", DISPOSITION_REVIEW_MODEL = "deepseek/deepseek-chat", DEEPGRAM_MODEL = "nova-3" }

[[env.staging.workflows]]
name = "eavesly-evaluation-staging"
binding = "EVALUATION_WORKFLOW"
class_name = "EvaluationWorkflow"

[[env.staging.workflows]]
name = "eavesly-achieve-backfill-canary-staging"
binding = "ACHIEVE_BACKFILL_CANARY_WORKFLOW"
class_name = "AchieveBackfillCanaryWorkflow"

[[env.staging.workflows]]
name = "eavesly-achieve-backfill-remaining56-staging"
binding = "ACHIEVE_BACKFILL_REMAINING56_WORKFLOW"
class_name = "AchieveBackfillRemaining56Workflow"

[[env.staging.workflows]]
name = "eavesly-achieve-backfill-resume27-staging"
binding = "ACHIEVE_BACKFILL_RESUME27_WORKFLOW"
class_name = "AchieveBackfillResume27Workflow"

[[env.staging.workflows]]
name = "eavesly-achieve-qa-recovery-staging"
binding = "ACHIEVE_QA_RECOVERY_WORKFLOW"
class_name = "AchieveQaRecoveryWorkflow"

[env.production]
name = "eavesly-production"
vars = { ENVIRONMENT = "production", OPENROUTER_MODEL = "openai/gpt-4.1", DISPOSITION_REVIEW_MODEL = "deepseek/deepseek-chat", DEEPGRAM_MODEL = "nova-3" }
routes = [
  { pattern = "eavesly-api.trypennie.dev/*", zone_name = "trypennie.dev" }
]

[[env.production.workflows]]
name = "eavesly-evaluation-production"
binding = "EVALUATION_WORKFLOW"
class_name = "EvaluationWorkflow"

[[env.production.workflows]]
name = "eavesly-achieve-backfill-canary-production"
binding = "ACHIEVE_BACKFILL_CANARY_WORKFLOW"
class_name = "AchieveBackfillCanaryWorkflow"

[[env.production.workflows]]
name = "eavesly-achieve-backfill-remaining56-production"
binding = "ACHIEVE_BACKFILL_REMAINING56_WORKFLOW"
class_name = "AchieveBackfillRemaining56Workflow"

[[env.production.workflows]]
name = "eavesly-achieve-backfill-resume27-production"
binding = "ACHIEVE_BACKFILL_RESUME27_WORKFLOW"
class_name = "AchieveBackfillResume27Workflow"

[[env.production.workflows]]
name = "eavesly-achieve-qa-recovery-production"
binding = "ACHIEVE_QA_RECOVERY_WORKFLOW"
class_name = "AchieveQaRecoveryWorkflow"
